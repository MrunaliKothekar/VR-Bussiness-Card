plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.arcard'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.arcard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // ✅ Fix native lib conflicts
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libfilament-jni.so'
        pickFirst 'lib/armeabi-v7a/libfilament-jni.so'
        pickFirst 'lib/x86/libfilament-jni.so'
        pickFirst 'lib/x86_64/libfilament-jni.so'
    }
}


dependencies {

    implementation 'com.google.ar:core:1.40.0'
    implementation 'com.google.ar.sceneform.ux:sceneform-ux:1.17.1'

    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-database'

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.firebase:firebase-storage:20.3.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}


configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}